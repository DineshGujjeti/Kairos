server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-file route resolves to index.html so
    # client-side routing (react-router) works on hard refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the backend's infra health probe too -- HealthCheckPage.tsx
    # calls /health directly (deliberately outside /api/v1, see that
    # file's comment), so nginx needs its own route for it in
    # production; Vite's dev proxy (vite.config.ts) only covers /api.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # In production, the API is reverse-proxied through this same origin
    # via the 'backend' service name on the Docker network -- avoids
    # exposing the backend port publicly and avoids CORS in prod.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
